---
# Scans every push and pull request for committed secrets. The repository is
# public and forked, so anything that lands in history cannot be recalled;
# this check is the last line before that happens.
name: secret-scan
"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
