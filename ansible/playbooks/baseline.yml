---
- name: Apply the host baseline
  hosts: komodo
  become: true
  gather_facts: true
  roles:
    - role: host_baseline

- name: Apply SSH access outside the Komodo baseline
  hosts: ssh_access:!komodo
  become: true
  gather_facts: false
  tasks:
    - name: Run break-glass SSH tasks
      ansible.builtin.include_role:
        name: host_baseline
        tasks_from: break_glass
      tags: [ssh_access, break_glass]

    - name: Run Tailscale SSH tasks
      ansible.builtin.include_role:
        name: host_baseline
        tasks_from: tailscale_ssh
      tags: [ssh_access, tailscale]

- name: Apply the ZFS host baseline
  hosts: zfs_hosts
  become: true
  gather_facts: true
  roles:
    - role: zfs_host

- name: Verify the Proxmox baseline
  hosts: proxmox
  become: true
  gather_facts: false
  tasks:
    - name: Run opt-in TCP BBR reliability tasks
      ansible.builtin.include_role:
        name: host_baseline
        tasks_from: bbr
      tags: [reliability, bbr]

    - name: Run host_baseline verify checks
      ansible.builtin.include_role:
        name: host_baseline
        tasks_from: verify

- name: Apply the file server role
  hosts: file_servers
  become: true
  gather_facts: true
  roles:
    - role: file_server
      tags: [file_server]
