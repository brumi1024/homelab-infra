---
- name: Upgrade Komodo Core
  hosts: core
  become: true
  gather_facts: true
  roles:
    - role: komodo_core
      tags: [core]

- name: Upgrade Komodo Periphery
  hosts: periphery
  become: true
  gather_facts: true
  serial: 2
  roles:
    - role: bpbradley.komodo
      vars:
        komodo_action: update
        komodo_version: "{{ komodo_periphery_version }}"
      tags: [periphery]
