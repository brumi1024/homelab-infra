---
- name: Check for an existing API key in 1Password
  ansible.builtin.command:
    argv:
      - op
      - item
      - get
      - Komodo
      - --vault
      - "{{ homelab_op_vault }}"
      - --fields
      - komodo_api_key
  register: komodo_auth_existing_api_key
  changed_when: false
  check_mode: false
  failed_when: false
  no_log: true

- name: Wait for Komodo Core to answer
  ansible.builtin.uri:
    url: "{{ komodo_api_url }}"
    method: GET
    status_code: [200]
  retries: "{{ komodo_auth_max_retries }}"
  delay: "{{ komodo_auth_retry_delay }}"

- name: Log in as the admin user
  ansible.builtin.uri:
    url: "{{ komodo_api_url }}/auth"
    method: POST
    headers:
      Content-Type: application/json
    body_format: json
    body:
      type: LoginLocalUser
      params:
        username: "{{ komodo_auth_admin_username }}"
        password: "{{ komodo_auth_admin_password }}"
    status_code: [200]
  register: komodo_auth_login
  no_log: true

- name: Register the admin JWT
  ansible.builtin.set_fact:
    komodo_auth_jwt: "{{ komodo_auth_login.json.jwt }}"
  no_log: true

- name: Look up the service user
  ansible.builtin.include_role:
    name: komodo_api
    tasks_from: call
  vars:
    komodo_api_endpoint: read
    komodo_api_type: FindUser
    komodo_api_params:
      username: "{{ komodo_auth_service_user }}"
    komodo_api_status: [200, 404]
    komodo_api_jwt: "{{ komodo_auth_jwt }}"
  no_log: true

- name: Save the service user lookup
  ansible.builtin.set_fact:
    komodo_auth_service_user_lookup: "{{ komodo_api_result }}"
  no_log: true

- name: Create the service user when it does not exist
  ansible.builtin.include_role:
    name: komodo_api
    tasks_from: call
  vars:
    komodo_api_endpoint: write
    komodo_api_type: CreateServiceUser
    komodo_api_params:
      username: "{{ komodo_auth_service_user }}"
      description: "{{ komodo_auth_service_user_description }}"
    komodo_api_jwt: "{{ komodo_auth_jwt }}"
  when: komodo_auth_service_user_lookup.status != 200
  no_log: true

- name: Resolve the service user id
  ansible.builtin.set_fact:
    komodo_auth_service_user_id: >-
      {{
        (komodo_api_result.json._id['$oid'])
        if komodo_auth_service_user_lookup.status != 200
        else komodo_auth_service_user_lookup.json._id['$oid']
      }}
  no_log: true

- name: Grant the service user admin permissions
  ansible.builtin.include_role:
    name: komodo_api
    tasks_from: call
  vars:
    komodo_api_endpoint: write
    komodo_api_type: UpdateUserAdmin
    komodo_api_params:
      user_id: "{{ komodo_auth_service_user_id }}"
      admin: true
    komodo_api_jwt: "{{ komodo_auth_jwt }}"
  no_log: true

- name: Create and store a service user API key
  when: komodo_auth_existing_api_key.stdout == "" or komodo_auth_force_recreate | bool
  no_log: true
  block:
    - name: Create an API key for the service user
      ansible.builtin.include_role:
        name: komodo_api
        tasks_from: call
      vars:
        komodo_api_endpoint: write
        komodo_api_type: CreateApiKeyForServiceUser
        komodo_api_params:
          user_id: "{{ komodo_auth_service_user_id }}"
          name: "{{ komodo_auth_api_key_name }}"
          expires: 0
        komodo_api_jwt: "{{ komodo_auth_jwt }}"

    - name: Store the API key in 1Password
      ansible.builtin.command:
        argv:
          - op
          - item
          - edit
          - Komodo
          - --vault
          - "{{ homelab_op_vault }}"
          - "komodo_api_key={{ komodo_api_result.json.key }}"
      changed_when: true

    - name: Store the API secret in 1Password
      ansible.builtin.command:
        argv:
          - op
          - item
          - edit
          - Komodo
          - --vault
          - "{{ homelab_op_vault }}"
          - "komodo_api_secret={{ komodo_api_result.json.secret }}"
      changed_when: true
