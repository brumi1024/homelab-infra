---
- name: Ensure rsync and curl are installed
  ansible.builtin.apt:
    name:
      - rsync
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: rsync_push

- name: Ensure /root/.ssh exists
  ansible.builtin.file:
    path: /root/.ssh
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: rsync_push_jobs | length > 0
  tags: rsync_push

- name: Look up the rsync SSH private key
  ansible.builtin.set_fact:
    rsync_push_ssh_private_key: >-
      {{
        lookup(
          'community.general.onepassword',
          rsync_push_ssh_key_item,
          field='private key',
          vault=homelab_op_vault
        )
      }}
  no_log: true
  when: rsync_push_jobs | length > 0
  tags: rsync_push

- name: Install the rsync SSH private key
  ansible.builtin.copy:
    content: "{{ rsync_push_ssh_private_key }}"
    dest: /root/.ssh/id_rsync
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: rsync_push_jobs | length > 0
  tags: rsync_push

- name: Pin rsync target host keys
  ansible.builtin.blockinfile:
    path: /root/.ssh/known_hosts
    create: true
    owner: root
    group: root
    mode: "0600"
    marker: "# {mark} ANSIBLE MANAGED rsync_push known hosts"
    block: "{{ rsync_push_known_hosts | join('\n') }}"
  when: rsync_push_jobs | length > 0
  tags: rsync_push

- name: Look up the rsync failure notification URL
  ansible.builtin.set_fact:
    rsync_push_failure_notify_url: >-
      {{
        lookup(
          'community.general.onepassword',
          rsync_push_failure_notify_item,
          field=rsync_push_failure_notify_field,
          vault=homelab_op_vault
        )
      }}
  no_log: true
  when: rsync_push_failure_notify_item | length > 0
  tags: rsync_push

- name: Install the rsync failure notification script
  ansible.builtin.template:
    src: rsync-notify-failure.sh.j2
    dest: /usr/local/sbin/rsync-push-notify-failure
    owner: root
    group: root
    mode: "0700"
  when: rsync_push_failure_notify_item | length > 0
  no_log: true
  tags: rsync_push

- name: Install the rsync failure notification unit
  ansible.builtin.template:
    src: rsync-failure-notify@.service.j2
    dest: /etc/systemd/system/rsync-failure-notify@.service
    owner: root
    group: root
    mode: "0644"
  when: rsync_push_failure_notify_item | length > 0
  notify: Reload systemd
  tags: rsync_push

- name: Template the rsync push wrapper script
  ansible.builtin.template:
    src: rsync-push.sh.j2
    dest: "/usr/local/sbin/rsync-push-{{ item.name }}"
    owner: root
    group: root
    mode: "0700"
  vars:
    job: "{{ item }}"
  loop: "{{ rsync_push_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  tags: rsync_push

- name: Template the rsync push systemd service
  ansible.builtin.template:
    src: rsync-push.service.j2
    dest: "/etc/systemd/system/rsync-{{ item.name }}.service"
    owner: root
    group: root
    mode: "0644"
  vars:
    job: "{{ item }}"
  loop: "{{ rsync_push_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd
  tags: rsync_push

- name: Template the rsync push systemd timer
  ansible.builtin.template:
    src: rsync-push.timer.j2
    dest: "/etc/systemd/system/rsync-{{ item.name }}.timer"
    owner: root
    group: root
    mode: "0644"
  vars:
    job: "{{ item }}"
  loop: "{{ rsync_push_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  notify: Reload systemd
  tags: rsync_push

- name: Apply pending systemd reload before enabling timers
  ansible.builtin.meta: flush_handlers

- name: Check which rsync push timers are installed
  ansible.builtin.stat:
    path: "/etc/systemd/system/rsync-{{ item.name }}.timer"
  loop: "{{ rsync_push_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  register: rsync_push_timer_units
  check_mode: false
  tags: rsync_push

- name: Report the timer enables a dry run cannot perform
  ansible.builtin.debug:
    msg: >-
      rsync-{{ item.item.name }}.timer would be enabled and started
      once its unit file is installed.
  changed_when: true
  loop: "{{ rsync_push_timer_units.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when:
    - ansible_check_mode
    - not item.stat.exists
  tags: rsync_push

- name: Ensure each rsync push timer is enabled and running
  ansible.builtin.systemd:
    name: "rsync-{{ item.item.name }}.timer"
    enabled: true
    state: started
  loop: "{{ rsync_push_timer_units.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.stat.exists
  tags: rsync_push
