---
- name: Start with a clean rsync_push verification failure list
  ansible.builtin.set_fact:
    rsync_push_verify_failures: []
  tags: rsync_push

- name: Check each rsync push timer is active
  ansible.builtin.systemd:
    name: "rsync-{{ item.name }}.timer"
  register: rsync_push_verify_timer
  loop: "{{ rsync_push_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  tags: rsync_push

- name: Record inactive rsync push timers
  ansible.builtin.set_fact:
    rsync_push_verify_failures: >-
      {{
        rsync_push_verify_failures
        + [inventory_hostname ~ ' rsync-' ~ item.item.name ~ '.timer is not active.']
      }}
  loop: "{{ rsync_push_verify_timer.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: item.status.ActiveState | default('') != 'active'
  tags: rsync_push

- name: Check the last result of each rsync push service
  ansible.builtin.systemd:
    name: "rsync-{{ item.name }}.service"
  register: rsync_push_verify_result
  loop: "{{ rsync_push_jobs }}"
  loop_control:
    label: "{{ item.name }}"
  tags: rsync_push

- name: Record rsync push jobs whose last run did not succeed
  # An empty Result means the unit has never run yet, which is expected right
  # after a fresh apply and is not itself a failure.
  ansible.builtin.set_fact:
    rsync_push_verify_failures: >-
      {{
        rsync_push_verify_failures
        + [inventory_hostname ~ ' rsync-' ~ item.item.name ~ '.service last result was ' ~ (item.status.Result | default('') ) ~ '.']
      }}
  loop: "{{ rsync_push_verify_result.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: (item.status.Result | default('')) not in ['success', '']
  tags: rsync_push

- name: Check that a failure notification path exists for rsync jobs
  ansible.builtin.stat:
    path: /etc/systemd/system/rsync-failure-notify@.service
  register: rsync_push_verify_notify_unit
  changed_when: false
  check_mode: false
  when: rsync_push_jobs | length > 0
  tags: rsync_push

- name: Record a missing rsync failure notification path
  ansible.builtin.set_fact:
    rsync_push_verify_failures: >-
      {{
        rsync_push_verify_failures
        + [inventory_hostname ~ ' has rsync push jobs but no failure notification unit, so a failed backup would go unreported.']
      }}
  when:
    - rsync_push_jobs | length > 0
    - rsync_push_failure_notify_item | length > 0
    - not (rsync_push_verify_notify_unit.stat.exists | default(false))
  tags: rsync_push

- name: Require every rsync_push verification check to have passed
  ansible.builtin.assert:
    that:
      - rsync_push_verify_failures | length == 0
    fail_msg: "{{ rsync_push_verify_failures }}"
  tags: rsync_push
