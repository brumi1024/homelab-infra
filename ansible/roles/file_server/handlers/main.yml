---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true

- name: Restart smbd
  ansible.builtin.systemd:
    name: smbd
    state: restarted

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart avahi-daemon
  ansible.builtin.systemd:
    name: avahi-daemon
    state: restarted
