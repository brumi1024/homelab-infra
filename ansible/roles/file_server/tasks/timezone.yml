---
- name: Read the current timezone
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: file_server_timezone_current
  changed_when: false
  check_mode: false
  tags: file_server

- name: Set the timezone
  ansible.builtin.command: timedatectl set-timezone {{ file_server_timezone }}
  when: file_server_timezone_current.stdout | trim != file_server_timezone
  changed_when: true
  tags: file_server
