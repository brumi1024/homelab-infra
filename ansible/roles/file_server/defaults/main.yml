---
file_server_timezone: ""

# Samba
file_server_smb_workgroup: "WORKGROUP"
file_server_smb_server_string: "%h file server"
file_server_smb_conf_path: /etc/samba/smb.conf
# {name, path, valid_users or guest, read_only, time_machine, time_machine_max_size,
#  shadow_copies, comment}
file_server_shares: []

# Groups with a fixed gid, created before any user references them. {name, gid}
file_server_groups: []
# Unix and Samba accounts. {name, uid, group (primary, must be in
# file_server_groups), groups (secondary, created if not already declared),
# op_item (defaults to name), cockpit_admin (login shell, home, sudo, and the
# same 1Password password set as the Unix password)}
file_server_users: []
# Set true to force smbpasswd to re-run for every user on the next apply.
file_server_force_password_reset: false

# 45Drives repository backing cockpit-file-sharing, cockpit-navigator, and
# cockpit-identities; matches the community-scripts Cockpit LXC installer.
file_server_45drives_repo_url: "https://repo.45drives.com/enterprise/debian"
file_server_45drives_repo_key_url: "https://repo.45drives.com/key/gpg.asc"
