---
- name: Create Komodo installation directory
  ansible.builtin.file:
    path: "{{ komodo_install_dir }}"
    state: directory
    owner: "{{ ansible_user }}"
    mode: "0755"

- name: Create private VPS service networks
  community.docker.docker_network:
    name: "{{ item }}"
    state: present
  loop:
    - vps-ingress
    - monitoring-control

- name: Resolve this host's tailnet address
  ansible.builtin.command: tailscale ip -4
  register: komodo_core_tailnet_ip
  changed_when: false
  check_mode: false
  failed_when: false
  when: '"tailnet" in komodo_core_bind_addresses'

- name: Fail when the tailnet address cannot be resolved
  ansible.builtin.fail:
    msg: >-
      komodo_core_bind_addresses requests "tailnet", but this host reports no
      Tailscale IPv4. Bring tailscaled up, or list a literal address instead.
  when:
    - '"tailnet" in komodo_core_bind_addresses'
    - komodo_core_tailnet_ip.rc != 0 or komodo_core_tailnet_ip.stdout_lines | length == 0

- name: Resolve the addresses Core publishes its port on
  ansible.builtin.set_fact:
    komodo_core_resolved_bind_addresses: >-
      {{
        komodo_core_bind_addresses
        | map('regex_replace', '^tailnet$',
              komodo_core_tailnet_ip.stdout_lines | default([]) | first | default(''))
        | list
      }}

- name: Generate Komodo Docker Compose file from template
  ansible.builtin.template:
    src: komodo-compose.yml.j2
    dest: "{{ komodo_install_dir }}/compose.yml"
    mode: "0644"
  notify: Restart komodo

- name: Generate Komodo environment configuration from template
  ansible.builtin.template:
    src: compose.env.j2
    dest: "{{ komodo_install_dir }}/compose.env"
    mode: "0644"
    backup: true
  notify: Restart komodo
  no_log: true

- name: Generate core.config.toml from template
  ansible.builtin.template:
    src: core.config.toml.j2
    dest: "{{ komodo_install_dir }}/core.config.toml"
    mode: "0600"
  notify: Restart komodo
  no_log: true

- name: Deploy Komodo with Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ komodo_install_dir }}"
    project_name: "{{ komodo_compose_project_name }}"
    env_files:
      - "{{ komodo_install_dir }}/compose.env"
    state: present
    pull: always
    recreate: auto

- name: Apply pending Komodo restart handlers before health checks
  ansible.builtin.meta: flush_handlers

- name: Wait for MongoDB to be healthy
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - "{{ '{{.State.Health.Status}}' }}"
      - "{{ komodo_compose_project_name }}-mongo-1"
  register: komodo_core_mongo_wait_result
  changed_when: false
  check_mode: false
  retries: 30
  delay: 10
  until:
    - komodo_core_mongo_wait_result.rc == 0
    - komodo_core_mongo_wait_result.stdout == "healthy"
  failed_when: false

- name: Fail if MongoDB is not ready
  ansible.builtin.fail:
    msg: "MongoDB failed to start. Check Docker Compose logs and environment variables."
  when: >-
    komodo_core_mongo_wait_result.rc != 0
    or komodo_core_mongo_wait_result.stdout != "healthy"

- name: Wait for Komodo Core to be healthy
  ansible.builtin.uri:
    url: "{{ komodo_core_local_health_url }}"
    method: GET
  retries: 30
  delay: 10
  register: komodo_core_health
  until: komodo_core_health.status == 200
  ignore_errors: true

- name: Fail if Komodo Core is not healthy
  ansible.builtin.fail:
    msg: "Komodo Core failed to start. Check Docker Compose logs and environment variables."
  when: komodo_core_health is failed
