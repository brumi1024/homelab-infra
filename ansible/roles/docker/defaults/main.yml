---
docker_daemon_options:
  log-driver: local
  log-opts:
    max-size: 10m
    max-file: "3"
  storage-driver: overlay2
  features:
    buildkit: true
  # Docker's stock pools spill into 192.168.0.0/16 after fifteen networks and
  # shadow LAN routes; this one stays inside 172.16.0.0/12. bip pins docker0 to
  # its stock address, which the pool would otherwise hand out first.
  bip: 172.17.0.1/16
  default-address-pools:
    - base: 172.16.0.0/16
      size: 24

# Shared bridge networks that stacks on this host join as external networks.
docker_networks: []
