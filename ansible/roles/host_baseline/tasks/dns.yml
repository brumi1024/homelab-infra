---
# Keep host-level name resolution independent of Tailscale's resolv.conf snapshot.
#
# In "direct" mode tailscaled overwrites /etc/resolv.conf and falls back to a
# copy of whatever it found there the first time it ran. On a Proxmox LXC that
# copy is whatever the PVE host wrote at container start, which on a host that
# itself runs Tailscale is 100.100.100.100: tailscaled will not forward to
# itself, so every non-tailnet name answers SERVFAIL the moment the tailnet has
# no global nameservers. Containers survive because docker_dns_baseline.yml
# pins a fallback in daemon.json; host processes, Komodo Periphery's git fetch
# first among them, do not.
#
# Where systemd-resolved runs, the durable shape is: /etc/resolv.conf is the
# resolved stub, PVE is told not to rewrite it, and tailscaled programs only
# the tailnet routing domain on tailscale0. Public names then follow whatever
# DHCP gives eth0. Hosts without resolved (resolvconf on Debian cloud images,
# direct mode on bare metal) are left as they are and only verified.
- name: Detect systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved.service
  register: host_baseline_dns_resolved
  failed_when: false
  when: homelab_host_dns_enabled | bool

- name: Decide whether resolved owns resolution here
  ansible.builtin.set_fact:
    host_baseline_dns_use_resolved: >-
      {{
        homelab_host_dns_enabled | bool
        and host_baseline_dns_resolved.status is defined
        and host_baseline_dns_resolved.status.ActiveState | default('') == 'active'
      }}

- name: Stop Proxmox rewriting resolv.conf at container start
  ansible.builtin.file:
    path: /etc/.pve-ignore.resolv.conf
    state: touch
    owner: root
    group: root
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  when:
    - host_baseline_dns_use_resolved | bool
    - ansible_facts.virtualization_type | default('') == 'lxc'

- name: Point resolv.conf at the systemd-resolved stub
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true
  notify: Restart tailscaled
  when: host_baseline_dns_use_resolved | bool

- name: Apply resolver changes before verifying
  ansible.builtin.meta: flush_handlers

- name: Resolve a public name through the host resolver
  ansible.builtin.command:
    argv:
      - getent
      - hosts
      - "{{ homelab_host_dns_public_probe }}"
  register: host_baseline_dns_public
  check_mode: false
  changed_when: false
  failed_when: false
  when: homelab_host_dns_enabled | bool

- name: Resolve this host's own tailnet name
  ansible.builtin.command:
    argv:
      - getent
      - hosts
      - "{{ inventory_hostname }}.{{ homelab_tailnet }}"
  register: host_baseline_dns_tailnet
  check_mode: false
  changed_when: false
  failed_when: false
  when: homelab_host_dns_enabled | bool

- name: Require both public and tailnet names to resolve
  ansible.builtin.assert:
    that:
      - host_baseline_dns_public.rc == 0
      - host_baseline_dns_tailnet.rc == 0
    fail_msg: >-
      Host resolver is broken on {{ inventory_hostname }}:
      public={{ 'ok' if host_baseline_dns_public.rc == 0 else 'FAIL' }}
      tailnet={{ 'ok' if host_baseline_dns_tailnet.rc == 0 else 'FAIL' }}.
      Check 'tailscale dns status' and /etc/resolv.pre-tailscale-backup.conf.
    success_msg: "Host resolver answers public and tailnet names on {{ inventory_hostname }}."
  when: homelab_host_dns_enabled | bool
